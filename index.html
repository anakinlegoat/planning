<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Planning du jour premium, heure par heure, avec rappel automatique, vue semaine et barre de progression." />
  <title>Planning premium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:wght@600;700;800&display=swap">
  <style>
    :root {
      --bg: #eef5fb;
      --bg-2: #f9fbff;
      --panel: rgba(255,255,255,0.84);
      --panel-strong: #ffffff;
      --ink: #163042;
      --muted: #5e7282;
      --line: #dfeaf1;
      --accent: #1f6f8f;
      --accent-2: #2b84a9;
      --accent-soft: #e3f3fb;
      --success: #2e8f67;
      --warning: #f7d279;
      --danger: #d64b4b;
      --shadow: 0 18px 40px rgba(17, 40, 56, 0.12);
      --radius: 18px;
      --font-display: "Bricolage Grotesque", "Inter", sans-serif;
      --font-body: "Inter", sans-serif;
    }

    :root[data-theme="dark"] {
      --bg: #0f1b28;
      --bg-2: #152533;
      --panel: rgba(19, 31, 42, 0.9);
      --panel-strong: #192d3d;
      --ink: #edf6ff;
      --muted: #a2b6c7;
      --line: #2a4257;
      --accent: #71c2df;
      --accent-2: #93d8f0;
      --accent-soft: rgba(113,194,223,0.18);
      --success: #7ed6a8;
      --warning: #edc77b;
      --danger: #ff8e8e;
      --shadow: 0 22px 48px rgba(0,0,0,0.25);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-body);
      background:
        radial-gradient(circle at top left, rgba(31, 111, 143, 0.12), transparent 30%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
      color: var(--ink);
      padding: 28px 16px 52px;
    }
    [hidden] { display: none !important; }

    .wrap {
      max-width: 1160px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .top {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px 18px 18px;
      backdrop-filter: blur(10px);
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
    }

    h1 {
      margin: 0;
      font-family: var(--font-display);
      letter-spacing: -0.04em;
      font-size: clamp(30px, 5vw, 44px);
      line-height: 1;
    }

    .dateline {
      margin: 6px 0 0;
      font-size: .96rem;
      text-transform: capitalize;
      color: var(--muted);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button, input, select {
      font: inherit;
      color: inherit;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--panel-strong);
      color: var(--ink);
      border-radius: 12px;
      padding: 9px 13px;
      min-height: 40px;
      cursor: pointer;
      transition: transform .15s ease, border-color .2s ease, box-shadow .2s ease;
    }

    .btn:hover {
      border-color: var(--accent);
      box-shadow: 0 10px 20px rgba(31, 111, 143, 0.08);
    }

    .btn:active { transform: translateY(1px); }

    .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; border-color: transparent; font-weight: 700; }
    .btn.soft { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 700; }
    .btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 800; }

    .icon-btn { width: 40px; min-width: 40px; padding: 0; font-size: 1.05rem; }

    input[type="date"] {
      border: 1px solid var(--line);
      background: var(--panel-strong);
      min-height: 40px;
      border-radius: 12px;
      padding: 8px 10px;
    }

    .summary {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 18px;
      justify-content: space-between;
      padding-top: 14px;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      flex: 1 1 auto;
    }

    .chip {
      background: var(--panel-strong);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 12px;
      font-weight: 700;
      color: var(--ink);
    }

    .progress-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1 1 320px;
      max-width: 460px;
      min-width: 220px;
    }

    .progress-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .progress-value {
      font-size: 1.1rem;
      color: var(--ink);
      letter-spacing: normal;
      text-transform: none;
      font-weight: 800;
    }

    .progress-track {
      position: relative;
      overflow: hidden;
      height: 14px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,0.5), rgba(17, 27, 32, 0.04));
      border: 1px solid var(--line);
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
    }

    .progress-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--success), #7bd6b8, var(--accent));
      box-shadow: 0 0 18px rgba(46, 143, 103, 0.3);
      transition: width 0.4s ease;
    }

    .remind {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 12px;
      background: var(--panel-strong);
      border: 1px solid var(--line);
      color: var(--ink);
      cursor: pointer;
      min-height: 40px;
      user-select: none;
    }

    .remind input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      margin: 0;
    }

    .quick-add {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding: 12px 14px;
      background: var(--panel-strong);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    .quick-add input[type="text"] {
      flex: 1 1 220px;
      min-height: 42px;
      border: 1px solid var(--line);
      background: transparent;
      border-radius: 10px;
      padding: 9px 12px;
      color: var(--ink);
    }

    .quick-add select {
      min-width: 140px;
      min-height: 42px;
      border: 1px solid var(--line);
      background: transparent;
      border-radius: 10px;
      padding: 9px 12px;
      color: var(--ink);
    }

    .alert {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      border-radius: 14px;
      padding: 12px 14px;
      font-weight: 700;
      box-shadow: var(--shadow);
    }

    .alert .btn { color: var(--ink); }

    .sheet {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .head, .row {
      display: grid;
      grid-template-columns: 96px minmax(0,1.5fr) minmax(0,1.25fr) 120px 76px minmax(0,1.2fr);
      gap: 0 10px;
      align-items: center;
      padding: 8px 14px;
    }

    .head {
      background: var(--accent-soft);
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding-block: 12px;
    }

    .row {
      border-top: 1px solid var(--line);
      transition: background .2s ease;
    }

    .row.now {
      background: rgba(247, 210, 121, 0.18);
    }

    .time {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .time small {
      font-family: var(--font-body);
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }

    .row input[type="text"], .row select {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 8px;
      padding: 8px 9px;
      min-height: 38px;
      color: var(--ink);
    }

    .row input[type="text"]:hover, .row select:hover { border-color: var(--line); }
    .row input[type="text"]:focus, .row select:focus { border-color: var(--accent); background: var(--panel-strong); }
    .row select { appearance: auto; cursor: pointer; }
    .row select[data-p="Haute"] { color: var(--danger); font-weight:700; }
    .row select[data-p="Moyenne"] { color: var(--warning); font-weight:700; }
    .row select[data-p="Basse"] { color: var(--success); font-weight:700; }

    .done {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 38px;
      user-select: none;
      cursor: pointer;
      padding-inline: 4px;
    }

    .done input {
      width: 20px;
      height: 20px;
      accent-color: var(--success);
      margin: 0;
      cursor: pointer;
    }

    .row.is-done .a {
      text-decoration: line-through;
      color: var(--muted);
    }

    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(140px, 1fr));
      gap: 12px;
      padding: 14px;
    }

    .week-day {
      background: var(--panel-strong);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 10px;
      min-height: 220px;
    }

    .week-day.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(31,111,143,0.10);
    }

    .week-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }

    .week-date {
      color: var(--ink);
      font-size: 1.1rem;
      letter-spacing: normal;
      text-transform: none;
    }

    .week-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .week-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 9px;
      background: var(--accent-soft);
      border-radius: 10px;
      color: var(--ink);
      font-size: 12px;
    }

    .week-item strong {
      min-width: 42px;
      color: var(--accent);
      font-weight: 800;
      font-family: var(--font-display);
    }

    .week-empty {
      padding: 12px 8px;
      border: 1px dashed var(--line);
      color: var(--muted);
      border-radius: 10px;
      text-align: center;
      font-size: 12px;
    }

    .foot {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px 14px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
      padding-top: 4px;
    }

    .status {
      min-height: 1.2em;
      font-weight: 700;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    @media (max-width: 980px) {
      .week-grid { grid-template-columns: repeat(2, minmax(180px, 1fr)); }
    }

    @media (max-width: 780px) {
      .head { display: none; }
      .row {
        grid-template-columns: 1fr auto auto;
        grid-template-areas:
          "time p d"
          "a a a"
          "l l l"
          "n n n";
        gap: 6px 8px;
        padding: 12px 14px;
      }
      .time { grid-area: time; }
      .row .p { grid-area: p; width: auto; }
      .row .d { grid-area: d; }
      .row .a { grid-area: a; }
      .row .l { grid-area: l; }
      .row .n { grid-area: n; }
      .row input[type="text"], .row select { border-color: var(--line); }
      .stats { width: 100%; }
      .progress-panel { max-width: none; }
      .summary { align-items: stretch; }
      .remind { flex: 1 1 100%; justify-content: center; }
      .week-grid { grid-template-columns: 1fr; }
      .quick-add { flex-direction: column; align-items: stretch; }
      .quick-add input[type="text"], .quick-add select, .quick-add .btn { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .progress-fill, .btn { transition: none; }
    }

    @media print {
      body { background: white; padding: 0; }
      .alert, .controls, .remind, .actions, .chip, #themeToggle, .progress-panel, .quick-add { display: none !important; }
      .top, .sheet { box-shadow: none; border-color: #ccc; }
      .wrap { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <header>
        <div>
          <h1>Planning du jour</h1>
          <p class="dateline" id="dateline"></p>
        </div>
        <div class="controls">
          <button type="button" class="btn icon-btn" id="prev" aria-label="Jour précédent">‹</button>
          <input type="date" id="date" aria-label="Choisir le jour">
          <button type="button" class="btn icon-btn" id="next" aria-label="Jour suivant">›</button>
          <button type="button" class="btn primary" id="today">Aujourd’hui</button>
          <button type="button" class="btn" id="themeToggle" aria-label="Changer de thème">🌙</button>
          <button type="button" class="btn soft" id="printBtn">Imprimer</button>
          <button type="button" class="btn active view-btn" data-view="day">Jour</button>
          <button type="button" class="btn view-btn" data-view="week">Semaine</button>
        </div>
      </header>

      <div class="summary">
        <div class="stats">
          <span class="chip" id="count">0 tâche</span>
          <span class="chip" id="nextWindow">Prochain créneau : —</span>
        </div>

        <div class="progress-panel" aria-label="Progression de la journée">
          <div class="progress-head">
            <span>Progression</span>
            <span class="progress-value" id="progressValue">0%</span>
          </div>
          <div class="progress-track" aria-hidden="true">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>

        <label class="remind"><input type="checkbox" id="remind"> Rappel à chaque changement d’heure</label>
      </div>

      <div class="quick-add" id="quickAddBox">
        <input type="text" id="quickTaskInput" placeholder="Ajouter une tâche rapide..." aria-label="Ajouter une tâche rapide">
        <select id="quickPrioritySelect" aria-label="Priorité de la tâche rapide">
          <option value="">Priorité</option>
          <option value="Haute">Haute</option>
          <option value="Moyenne">Moyenne</option>
          <option value="Basse">Basse</option>
        </select>
        <button type="button" class="btn primary" id="quickAddBtn">Ajouter</button>
      </div>
    </div>

    <div class="alert" id="alert" role="alert" hidden>
      <span id="alerttext"></span>
      <button type="button" class="btn" id="alertok">OK</button>
    </div>

    <div class="sheet">
      <div class="head" aria-hidden="true">
        <span>Heure</span>
        <span>Activité / tâche</span>
        <span>Lieu / avec qui</span>
        <span>Priorité</span>
        <span>Fait</span>
        <span>Notes</span>
      </div>
      <div id="rows"></div>
      <div id="weekView" class="week-grid" hidden></div>
    </div>

    <div class="foot">
      <span class="status" id="status" role="status" aria-live="polite"></span>
      <div class="actions">
        <button type="button" class="btn soft" id="addSlot">+ Ajouter un créneau</button>
        <button type="button" class="btn" id="removeSlot">− Retirer le dernier</button>
        <button type="button" class="btn" id="clear">Vider la journée</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var START = 6;
      var END = 23;
      var dateKey = keyOf(new Date());
      var lastHour = new Date().getHours();
      var reminderEnabled = localStorage.getItem('planning:remind') === '1';
      var audioCtx = null;
      var wakeLock = null;
      var viewMode = 'day';

      function pad(n) {
        return String(n).padStart(2, '0');
      }

      function keyOf(date) {
        return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate());
      }

      function parseKey(key) {
        var p = key.split('-');
        return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
      }

      function byId(id) { return document.getElementById(id); }

      function startOfWeek(date) {
        var d = new Date(date);
        var day = (d.getDay() + 6) % 7;
        d.setDate(d.getDate() - day);
        d.setHours(0,0,0,0);
        return d;
      }

      function buildRows() {
        var rowsEl = byId('rows');
        rowsEl.innerHTML = '';

        for (var h = START; h <= END; h++) {
          var row = document.createElement('div');
          row.className = 'row';
          row.dataset.h = String(h);

          var options = '<option value="">Priorité</option>' + ['Haute', 'Moyenne', 'Basse'].map(function (p) {
            return '<option value="' + p + '">' + p + '</option>';
          }).join('');

          row.innerHTML =
            '<div class="time">' + pad(h) + 'h<small>→ ' + pad((h + 1) % 24) + 'h</small></div>' +
            '<input type="text" class="a" id="a-' + h + '" aria-label="Activité de ' + pad(h) + 'h" placeholder="' + (h === 9 ? 'ex. Réunion d’équipe' : 'Activité / tâche') + '" autocomplete="off">' +
            '<input type="text" class="l" id="l-' + h + '" aria-label="Lieu ou personnes à ' + pad(h) + 'h" placeholder="' + (h === 9 ? 'ex. Salle B, avec Marie' : 'Lieu / avec qui') + '" autocomplete="off">' +
            '<select class="p" id="p-' + h + '" aria-label="Priorité à ' + pad(h) + 'h">' + options + '</select>' +
            '<label class="d done"><input type="checkbox" id="d-' + h + '" aria-label="Fait à ' + pad(h) + 'h"><span>Fait</span></label>' +
            '<input type="text" class="n" id="n-' + h + '" aria-label="Notes à ' + pad(h) + 'h" placeholder="Notes" autocomplete="off">';

          rowsEl.appendChild(row);
        }
      }

      function refreshVisuals() {
        var total = 0;
        var done = 0;
        var nextText = 'Prochain créneau : —';
        var percent = 0;

        for (var h = START; h <= END; h++) {
          var row = byId('rows').children[h - START];
          var isDone = byId('d-' + h).checked;
          if (!row) continue;

          row.classList.toggle('is-done', isDone);
          byId('p-' + h).dataset.p = byId('p-' + h).value;

          if (byId('a-' + h).value.trim() || isDone) {
            total += 1;
            if (isDone) done += 1;
          }

          if (!byId('a-' + h).value.trim() && !isDone && nextText === 'Prochain créneau : —') {
            nextText = 'Prochain créneau : ' + pad(h) + 'h';
          }
        }

        percent = total ? Math.min(100, Math.round((done / total) * 100)) : 0;
        byId('count').textContent = total === 0 ? '0 tâche' : done + ' / ' + total + ' faites';
        byId('progressFill').style.width = percent + '%';
        byId('progressValue').textContent = percent + '%';
        byId('nextWindow').textContent = nextText;
      }

      function getData() {
        var out = {};
        for (var h = START; h <= END; h++) {
          var item = {
            a: byId('a-' + h).value.trim(),
            l: byId('l-' + h).value.trim(),
            p: byId('p-' + h).value,
            d: byId('d-' + h).checked,
            n: byId('n-' + h).value.trim()
          };
          if (item.a || item.l || item.p || item.d || item.n) {
            out['h' + h] = item;
          }
        }
        return out;
      }

      function setData(data) {
        data = data || {};
        for (var h = START; h <= END; h++) {
          var item = data['h' + h] || {};
          byId('a-' + h).value = item.a || '';
          byId('l-' + h).value = item.l || '';
          byId('p-' + h).value = item.p || '';
          byId('d-' + h).checked = !!item.d;
          byId('n-' + h).value = item.n || '';
        }
        refreshVisuals();
      }

      function showDate() {
        byId('date').value = dateKey;

        if (viewMode === 'week') {
          var weekStart = startOfWeek(parseKey(dateKey));
          var weekEnd = new Date(weekStart);
          weekEnd.setDate(weekStart.getDate() + 6);
          byId('dateline').textContent = 'Semaine du ' + weekStart.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) + ' au ' + weekEnd.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
        } else {
          byId('dateline').textContent = parseKey(dateKey).toLocaleDateString('fr-FR', {
            weekday: 'long',
            day: 'numeric',
            month: 'long',
            year: 'numeric'
          });
        }

        markNow();
      }

      function markNow() {
        var now = new Date();
        var isToday = keyOf(now) === dateKey;
        var rows = byId('rows').children;

        for (var h = START; h <= END; h++) {
          if (rows[h - START]) {
            rows[h - START].classList.toggle('now', isToday && now.getHours() === h);
          }
        }
      }

      function setStatus(message) {
        byId('status').textContent = message || '';
      }

      function storageKey(dayKey) {
        return 'planning:' + dayKey;
      }

      function loadDay(dayKeyToLoad) {
        try {
          var raw = localStorage.getItem(storageKey(dayKeyToLoad));
          return raw ? JSON.parse(raw) : {};
        } catch (e) {
          return {};
        }
      }

      function saveDay(dayKeyToSave, data) {
        try {
          localStorage.setItem(storageKey(dayKeyToSave), JSON.stringify(data));
        } catch (e) {}
      }

      function persistNow() {
        setStatus('Enregistré');
        saveDay(dateKey, getData());
      }

      function onInputChange() {
        refreshVisuals();
        setStatus('Modification en cours…');
        clearTimeout(window._saveTimer);
        window._saveTimer = setTimeout(persistNow, 300);
      }

      function goTo(key) {
        dateKey = key;
        showDate();
        setData(loadDay(key));
        renderWeekView();
        setStatus('');
      }

      function addSlot() {
        if (END >= 24) {
          setStatus('Plage maximale atteinte');
          return;
        }
        END += 1;
        buildRows();
        setData(loadDay(dateKey));
        refreshVisuals();
      }

      function removeSlot() {
        if (END <= START) {
          setStatus('Impossible de supprimer');
          return;
        }
        END -= 1;
        buildRows();
        setData(loadDay(dateKey));
        refreshVisuals();
      }

      function quickAddTask() {
        var input = byId('quickTaskInput');
        var priority = byId('quickPrioritySelect').value;
        var text = input.value.trim();

        if (!text) {
          setStatus('Écris une tâche à ajouter');
          input.focus();
          return;
        }

        var startHour = new Date().getHours();
        var slot = -1;

        for (var h = START; h <= END; h++) {
          var idA = 'a-' + h;
          var current = byId(idA).value.trim();
          if (!current) {
            slot = h;
            break;
          }
        }

        if (slot === -1) {
          slot = Math.max(START, Math.min(END, startHour || 9));
          if (!byId('a-' + slot)) {
            slot = START;
          }
        }

        byId('a-' + slot).value = text;
        if (priority) byId('p-' + slot).value = priority;
        byId('n-' + slot).value = 'Ajoutée rapidement';

        refreshVisuals();
        persistNow();
        input.value = '';
        byId('quickPrioritySelect').value = '';
        input.focus();
        setStatus('Tâche ajoutée');
      }

      function ensureAudio() {
        try {
          if (!audioCtx) {
            var AudioCtor = window.AudioContext || window.webkitAudioContext;
            if (AudioCtor) audioCtx = new AudioCtor();
          }
          if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
        } catch (e) {}
      }

      function beep() {
        try {
          if (!audioCtx) return;
          var t = audioCtx.currentTime;
          [0, 0.25, 0.5].forEach(function (offset, index) {
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            osc.frequency.value = index === 2 ? 988 : 784;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(0.0001, t + offset);
            gain.gain.exponentialRampToValueAtTime(0.25, t + offset + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + offset + 0.2);
            osc.start(t + offset);
            osc.stop(t + offset + 0.22);
          });
        } catch (e) {}
      }

      function announceHour(hour) {
        var currentTask = byId('a-' + hour);
        if (!currentTask) return;

        var taskText = currentTask.value.trim();
        var nextEl = byId('a-' + (hour + 1));
        var nextText = nextEl ? nextEl.value.trim() : '';
        var message = 'Il est ' + pad(hour) + 'h. ' + (taskText ? 'À faire maintenant : ' + taskText + '.' : 'Rien de prévu sur ce créneau.');
        if (nextText) message += ' Ensuite à ' + pad(hour + 1) + 'h : ' + nextText + '.';

        byId('alerttext').textContent = message;
        byId('alert').hidden = false;
        beep();
        try { if (navigator.vibrate) navigator.vibrate([180, 80, 180]); } catch (e) {}
      }

      function keepAwake() {
        try {
          if (!reminderEnabled || document.hidden || !navigator.wakeLock) return;
          if (!wakeLock) {
            navigator.wakeLock.request('screen').then(function (lock) {
              wakeLock = lock;
              lock.addEventListener('release', function () { wakeLock = null; });
            }).catch(function () {});
          }
        } catch (e) {}
      }

      function tickReminder() {
        var now = new Date();
        var hour = now.getHours();

        if (hour !== lastHour) {
          lastHour = hour;
          markNow();
          if (reminderEnabled && keyOf(now) === dateKey) {
            announceHour(hour);
          }
        }
      }

      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('planning:theme', theme);
        byId('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';
        byId('themeToggle').title = theme === 'dark' ? 'Mode clair' : 'Mode sombre';
      }

      function initTheme() {
        var saved = localStorage.getItem('planning:theme') || 'light';
        applyTheme(saved);
        byId('themeToggle').addEventListener('click', function () {
          var current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          applyTheme(current);
        });
      }

      function renderWeekView() {
        var container = byId('weekView');
        var start = startOfWeek(parseKey(dateKey));
        var html = '';

        for (var i = 0; i < 7; i++) {
          var current = new Date(start);
          current.setDate(start.getDate() + i);
          var key = keyOf(current);
          var data = loadDay(key);
          var items = [];

          for (var h = START; h <= END; h++) {
            var item = data['h' + h];
            if (item && (item.a || item.l || item.p || item.d || item.n)) {
              items.push({ hour: h, item: item });
            }
          }

          html += '<div class="week-day' + (key === dateKey ? ' selected' : '') + '">';
          html += '<div class="week-title"><span>' + current.toLocaleDateString('fr-FR', { weekday: 'short' }) + '</span><span class="week-date">' + current.getDate() + '</span></div>';
          if (!items.length) {
            html += '<div class="week-empty">Vide</div>';
          } else {
            html += '<ul class="week-list">';
            for (var j = 0; j < items.length; j++) {
              var entry = items[j];
              var text = entry.item.a || 'Tâche';
              html += '<li class="week-item"><strong>' + pad(entry.hour) + 'h</strong><span>' + text + '</span></li>';
            }
            html += '</ul>';
          }
          html += '</div>';
        }

        container.innerHTML = html;
      }

      function renderCurrentView() {
        var isDay = viewMode === 'day';
        byId('rows').hidden = !isDay;
        byId('weekView').hidden = isDay;
        document.querySelectorAll('.view-btn').forEach(function (btn) {
          btn.classList.toggle('active', btn.dataset.view === viewMode);
        });
        if (!isDay) {
          renderWeekView();
        }
      }

      byId('rows').addEventListener('input', onInputChange);
      byId('rows').addEventListener('change', onInputChange);
      byId('date').addEventListener('change', function () { if (byId('date').value) goTo(byId('date').value); });

      byId('prev').addEventListener('click', function () {
        var day = parseKey(dateKey);
        if (viewMode === 'week') {
          day.setDate(day.getDate() - 7);
        } else {
          day.setDate(day.getDate() - 1);
        }
        goTo(keyOf(day));
      });

      byId('next').addEventListener('click', function () {
        var day = parseKey(dateKey);
        if (viewMode === 'week') {
          day.setDate(day.getDate() + 7);
        } else {
          day.setDate(day.getDate() + 1);
        }
        goTo(keyOf(day));
      });

      byId('today').addEventListener('click', function () { goTo(keyOf(new Date())); });
      byId('addSlot').addEventListener('click', addSlot);
      byId('removeSlot').addEventListener('click', removeSlot);
      byId('printBtn').addEventListener('click', function () { window.print(); });
      byId('quickAddBtn').addEventListener('click', quickAddTask);
      byId('quickTaskInput').addEventListener('keydown', function (event) {
        if (event.key === 'Enter') quickAddTask();
      });

      document.querySelectorAll('.view-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          viewMode = btn.dataset.view;
          renderCurrentView();
          showDate();
        });
      });

      var clearTimer = null;
      byId('clear').addEventListener('click', function () {
        var btn = byId('clear');
        if (btn.dataset.armed) {
          clearTimeout(clearTimer);
          delete btn.dataset.armed;
          btn.textContent = 'Vider la journée';
          setData({});
          persistNow();
          return;
        }

        btn.dataset.armed = '1';
        btn.textContent = 'Confirmer : tout effacer ?';
        clearTimer = setTimeout(function () {
          delete btn.dataset.armed;
          btn.textContent = 'Vider la journée';
        }, 3500);
      });

      byId('alertok').addEventListener('click', function () { byId('alert').hidden = true; });

      byId('remind').checked = reminderEnabled;
      byId('remind').addEventListener('change', function () {
        reminderEnabled = byId('remind').checked;
        localStorage.setItem('planning:remind', reminderEnabled ? '1' : '0');

        if (reminderEnabled) {
          ensureAudio();
          beep();
          keepAwake();
          setStatus('Rappel activé');
        } else {
          try { if (wakeLock) wakeLock.release(); } catch (e) {}
          setStatus('Rappel désactivé');
        }
      });

      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) {
          keepAwake();
          tickReminder();
        }
      });

      setInterval(tickReminder, 15000);
      initTheme();
      buildRows();
      showDate();
      renderCurrentView();
      setData(loadDay(dateKey));
    })();
  </script>
</body>
</html>
