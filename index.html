<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Planning de la journée heure par heure, à remplir, avec rappel à chaque changement d'heure.">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Planning du jour</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>try{var t=localStorage.getItem('planning:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f2f5f7;
  --surface:#ffffff;
  --ink:#18222d;
  --muted:#657283;
  --line:#d8e0e7;
  --accent:#1c6e8c;
  --accent-ink:#ffffff;
  --accent-soft:#e1eff4;
  --now:#fff3cf;
  --hi:#b3362f;
  --mid:#a36a00;
  --lo:#2b7a52;
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10171e;--surface:#17212b;--ink:#e6edf3;--muted:#92a0af;--line:#2a3846;
    --accent:#5fb4d1;--accent-ink:#0b1318;--accent-soft:#1b3340;--now:#3a3219;
    --hi:#ff8a82;--mid:#e5b251;--lo:#6fcf9b;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10171e;--surface:#17212b;--ink:#e6edf3;--muted:#92a0af;--line:#2a3846;
  --accent:#5fb4d1;--accent-ink:#0b1318;--accent-soft:#1b3340;--now:#3a3219;
  --hi:#ff8a82;--mid:#e5b251;--lo:#6fcf9b;color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.4;padding-block:24px 48px;padding-inline:16px}
.wrap{max-width:980px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
h1{font-family:var(--font-display);font-size:clamp(26px,5vw,36px);line-height:1.05;margin:0;letter-spacing:-0.01em;text-wrap:balance}
.dateline{color:var(--muted);margin:4px 0 0}
.dateline::first-letter{text-transform:uppercase}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,input,select{font:inherit;color:inherit}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
input[type="date"]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.summary{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;color:var(--muted);font-size:14px}
.bar{flex:1 1 200px;max-width:320px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--lo);transition:width .25s}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.head,.row{display:grid;grid-template-columns:96px minmax(0,1.4fr) minmax(0,1fr) 112px 76px minmax(0,1.2fr);gap:0 10px;align-items:center;padding:8px 14px}
.head{background:var(--accent-soft);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-block:10px}
.row{border-top:1px solid var(--line)}
.row.now{background:var(--now)}
.time{font-variant-numeric:tabular-nums;font-weight:600;font-family:var(--font-display);font-size:17px;display:flex;align-items:baseline;gap:6px}
.time small{font-family:var(--font-body);font-weight:400;font-size:12px;color:var(--muted)}
.row input[type="text"],.row select{width:100%;min-width:0;background:transparent;border:1px solid transparent;border-radius:6px;padding:7px 8px;min-height:38px}
.row input[type="text"]:hover,.row select:hover{border-color:var(--line)}
.row input[type="text"]:focus,.row select:focus{border-color:var(--accent);background:var(--surface)}
.row select{appearance:auto;cursor:pointer}
.row select[data-p="Haute"]{color:var(--hi);font-weight:600}
.row select[data-p="Moyenne"]{color:var(--mid);font-weight:600}
.row select[data-p="Basse"]{color:var(--lo);font-weight:600}
.done{display:flex;align-items:center;gap:6px;cursor:pointer;min-height:38px;padding-inline:4px}
.done input{width:20px;height:20px;accent-color:var(--lo);margin:0;cursor:pointer}
.row.is-done .a{text-decoration:line-through;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}
.status{min-height:1.2em}
@media (max-width:720px){
  .head{display:none}
  .row{grid-template-columns:1fr auto auto;grid-template-areas:"time p d" "a a a" "l l l" "n n n";gap:4px 8px;padding:12px 14px}
  .time{grid-area:time}
  .row .p{grid-area:p;width:auto}
  .row .d{grid-area:d}
  .row .a{grid-area:a}
  .row .l{grid-area:l}
  .row .n{grid-area:n}
  .row input[type="text"]{border-color:var(--line)}
}
.alert{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:12px 16px;font-weight:600}
.alert .btn{color:var(--ink)}
.remind{display:flex;align-items:center;gap:8px;cursor:pointer;min-height:40px;color:var(--ink)}
.remind input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:space-between;align-items:center}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.tab{border:0;background:transparent;padding:8px 18px;min-height:40px;cursor:pointer;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
body[data-view="week"] .dayonly{display:none}
body[data-view="day"] .week{display:none}
body[data-view="week"] .wrap{max-width:1200px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:start}
.wday{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.wday.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wday-head{width:100%;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;padding:10px 12px;background:var(--accent-soft);border:0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;color:var(--ink)}
.wname{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.wnum{font-family:var(--font-display);font-size:20px;font-weight:700}
.wcount{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.wlist{list-style:none;margin:0;padding:8px 12px 10px;display:flex;flex-direction:column;gap:6px}
.wlist li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;font-size:13px;align-items:baseline}
.wh{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.wt{overflow-wrap:anywhere}
.wlist li.is-done .wt{text-decoration:line-through;color:var(--muted)}
.wlist li[data-p="Haute"] .wh{color:var(--hi)}
.wlist li[data-p="Moyenne"] .wh{color:var(--mid)}
.wlist li[data-p="Basse"] .wh{color:var(--lo)}
.wempty{margin:0;padding:10px 12px 12px;color:var(--muted);font-size:13px}
@media (max-width:900px){.week{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:640px){.week{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.week{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

</head>
<body data-view="day">
<div class="wrap">
  <header>
    <div>
      <h1>Planning du jour</h1>
      <p class="dateline" id="dateline"></p>
    </div>
    <div class="controls">
      <button class="btn" id="prev" type="button" aria-label="Jour précédent">‹</button>
      <input type="date" id="date" aria-label="Choisir le jour">
      <button class="btn" id="next" type="button" aria-label="Jour suivant">›</button>
      <button class="btn primary" id="today" type="button">Aujourd’hui</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="tabs" role="tablist" aria-label="Affichage">
      <button class="tab" id="tabday" type="button" role="tab" aria-selected="true">Jour</button>
      <button class="tab" id="tabweek" type="button" role="tab" aria-selected="false">Semaine</button>
    </div>
    <button class="btn" id="theme" type="button">Thème sombre</button>
  </div>

  <div class="alert" id="alert" role="alert" hidden>
    <span id="alerttext"></span>
    <button class="btn" id="alertok" type="button">OK</button>
  </div>

  <div class="summary dayonly">
    <span id="count">0 tâche</span>
    <div class="bar" aria-hidden="true"><i id="barfill"></i></div>
    <label class="remind"><input type="checkbox" id="remind"> Me prévenir à chaque changement d’heure</label>
  </div>

  <div class="sheet dayonly">
    <div class="head" aria-hidden="true">
      <span>Heure</span><span>Activité / tâche</span><span>Lieu / avec qui</span><span>Priorité</span><span>Fait</span><span>Notes</span>
    </div>
    <div id="rows"></div>
  </div>

  <div class="foot dayonly">
    <span class="status" id="status" role="status" aria-live="polite"></span>
    <button class="btn" id="clear" type="button">Vider la journée</button>
  </div>

  <div class="week" id="week"></div>
</div>

<script>
(function(){
  var START=6, END=23;
  var rowsEl=document.getElementById('rows');
  var statusEl=document.getElementById('status');
  var dateEl=document.getElementById('date');
  var db=null, uid=null, touched=false, usingCloud=false;
  var timer=null, saving=false, pending=null;
  var view='day', weekToken=0;
  function pad(n){return String(n).padStart(2,'0');}
  function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  function parseKey(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
  var dateKey=keyOf(new Date());

  /* ---------- build rows ---------- */
  var PRIOS=['Haute','Moyenne','Basse'];
  for(var h=START;h<=END;h++){
    var row=document.createElement('div');
    row.className='row';
    row.dataset.h=h;
    var opts='<option value="">Priorité</option>'+PRIOS.map(function(p){return '<option value="'+p+'">'+p+'</option>';}).join('');
    row.innerHTML=
      '<div class="time">'+pad(h)+'h<small>→ '+pad((h+1)%24)+'h</small></div>'+
      '<input type="text" class="a" id="a-'+h+'" aria-label="Activité de '+pad(h)+'h" placeholder="'+(h===9?'ex. Réunion d’équipe':'Activité / tâche')+'" autocomplete="off">'+
      '<input type="text" class="l" id="l-'+h+'" aria-label="Lieu ou personnes à '+pad(h)+'h" placeholder="'+(h===9?'ex. Salle B, avec Marie':'Lieu / avec qui')+'" autocomplete="off">'+
      '<select class="p" id="p-'+h+'" aria-label="Priorité à '+pad(h)+'h">'+opts+'</select>'+
      '<label class="d done"><input type="checkbox" id="d-'+h+'" aria-label="Fait à '+pad(h)+'h"><span>Fait</span></label>'+
      '<input type="text" class="n" id="n-'+h+'" aria-label="Notes à '+pad(h)+'h" placeholder="Notes" autocomplete="off">';
    rowsEl.appendChild(row);
  }

  function $(id){return document.getElementById(id);}
  function getData(){
    var out={};
    for(var h=START;h<=END;h++){
      var r={a:$('a-'+h).value.trim(),l:$('l-'+h).value.trim(),p:$('p-'+h).value,d:$('d-'+h).checked,n:$('n-'+h).value.trim()};
      if(r.a||r.l||r.p||r.d||r.n) out['h'+h]=r;
    }
    return out;
  }
  function setData(obj){
    obj=obj||{};
    for(var h=START;h<=END;h++){
      var r=obj['h'+h]||{};
      $('a-'+h).value=r.a||'';
      $('l-'+h).value=r.l||'';
      $('p-'+h).value=r.p||'';
      $('d-'+h).checked=!!r.d;
      $('n-'+h).value=r.n||'';
    }
    refresh();
  }
  function refresh(){
    var total=0,done=0;
    for(var h=START;h<=END;h++){
      var row=rowsEl.children[h-START];
      var isDone=$('d-'+h).checked;
      row.classList.toggle('is-done',isDone);
      $('p-'+h).dataset.p=$('p-'+h).value;
      if($('a-'+h).value.trim()||isDone){total++; if(isDone)done++;}
    }
    $('count').textContent=total===0?'Aucune tâche pour ce jour':done+' sur '+total+(total>1?' tâches faites':' tâche faite');
    $('barfill').style.width=(total?Math.round(done/total*100):0)+'%';
  }
  function markNow(){
    var now=new Date(), isToday=keyOf(now)===dateKey;
    for(var h=START;h<=END;h++){
      rowsEl.children[h-START].classList.toggle('now',isToday&&now.getHours()===h);
    }
  }
  function showDate(){
    dateEl.value=dateKey;
    $('dateline').textContent=view==='week'?weekLabel():parseKey(dateKey).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    markNow();
  }

  /* ---------- storage ---------- */
  function localGet(k){try{var v=localStorage.getItem('planning:'+k);return v?JSON.parse(v):null;}catch(e){return null;}}
  function localSet(k,v){try{localStorage.setItem('planning:'+k,JSON.stringify(v));}catch(e){}}
  function docRef(k){return db.doc('data/users/'+uid+'/'+k);}
  async function load(k){
    if(db&&uid){
      try{
        var s=await docRef(k).get();
        if(s.exists){var d=s.data();return (d&&d.rows)||{};}
      }catch(e){}
    }
    return localGet(k);
  }
  function setStatus(t){statusEl.textContent=t;}
  function schedule(){
    touched=true;
    refresh();
    setStatus('Modification en cours…');
    pending={key:dateKey,rows:getData()};
    clearTimeout(timer);
    timer=setTimeout(flush,600);
  }
  async function flush(){
    clearTimeout(timer);
    if(saving||!pending) return;
    saving=true;
    var p=pending; pending=null;
    localSet(p.key,p.rows);
    var cloud=false;
    if(db&&uid){
      try{ await docRef(p.key).set({rows:p.rows}); cloud=true; }catch(e){}
    }
    saving=false;
    if(pending){ flush(); return; }
    setStatus(cloud?'Enregistré':'Enregistré sur cet appareil');
  }
  function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
  async function settle(){
    clearTimeout(timer);
    for(var i=0;i<100&&(pending||saving);i++){
      if(!saving&&pending) await flush(); else await sleep(50);
    }
  }
  async function goTo(key){
    await settle();
    dateKey=key; touched=false;
    showDate();
    setStatus('');
    if(view==='week'){ await renderWeek(); } else { setData(await load(key)); }
  }

  /* ---------- events ---------- */
  rowsEl.addEventListener('input',schedule);
  rowsEl.addEventListener('change',schedule);
  dateEl.addEventListener('change',function(){ if(dateEl.value) goTo(dateEl.value); });
  $('prev').addEventListener('click',function(){var d=parseKey(dateKey);d.setDate(d.getDate()-(view==='week'?7:1));goTo(keyOf(d));});
  $('next').addEventListener('click',function(){var d=parseKey(dateKey);d.setDate(d.getDate()+(view==='week'?7:1));goTo(keyOf(d));});
  $('today').addEventListener('click',function(){goTo(keyOf(new Date()));});
  var clearTimer=null;
  $('clear').addEventListener('click',function(){
    var b=$('clear');
    if(b.dataset.armed){
      clearTimeout(clearTimer); delete b.dataset.armed; b.textContent='Vider la journée';
      setData({}); schedule();
    }else{
      b.dataset.armed='1'; b.textContent='Confirmer : tout effacer ?';
      clearTimer=setTimeout(function(){delete b.dataset.armed;b.textContent='Vider la journée';},3500);
    }
  });
  document.addEventListener('visibilitychange',function(){ if(document.hidden) flush(); });
  setInterval(markNow,60000);

  /* ---------- rappel à chaque changement d'heure ---------- */
  var remindEl=$('remind'), audioCtx=null, wakeLock=null, lastHour=new Date().getHours();
  function ensureAudio(){
    try{
      if(!audioCtx){ var AC=window.AudioContext||window.webkitAudioContext; if(AC) audioCtx=new AC(); }
      if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume();
    }catch(e){}
  }
  function keepAwake(){
    try{
      if(remindEl.checked&&navigator.wakeLock&&!wakeLock&&!document.hidden){
        navigator.wakeLock.request('screen').then(function(l){
          wakeLock=l; l.addEventListener('release',function(){wakeLock=null;});
        }).catch(function(){});
      }
    }catch(e){}
  }
  function beep(){
    try{
      if(!audioCtx) return;
      var t=audioCtx.currentTime;
      [0,0.25,0.5].forEach(function(o,i){
        var osc=audioCtx.createOscillator(), g=audioCtx.createGain();
        osc.frequency.value=i===2?988:784;
        osc.connect(g); g.connect(audioCtx.destination);
        g.gain.setValueAtTime(0.0001,t+o);
        g.gain.exponentialRampToValueAtTime(0.25,t+o+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,t+o+0.2);
        osc.start(t+o); osc.stop(t+o+0.22);
      });
    }catch(e){}
  }
  function actAt(h){var el=document.getElementById('a-'+h);return el?el.value.trim():'';}
  function announce(h){
    var cur=actAt(h), nxt=actAt(h+1);
    var txt='Il est '+pad(h)+'h. '+(cur?'À faire maintenant : '+cur+'.':'Rien de prévu sur ce créneau.');
    if(nxt) txt+=' Ensuite à '+pad(h+1)+'h : '+nxt+'.';
    $('alerttext').textContent=txt;
    $('alert').hidden=false;
    beep();
    try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
  }
  function tick(){
    var now=new Date(), h=now.getHours();
    if(h!==lastHour){
      lastHour=h; markNow();
      if(remindEl.checked&&keyOf(now)===dateKey) announce(h);
    }
  }
  remindEl.addEventListener('change',function(){
    try{localStorage.setItem('planning:remind',remindEl.checked?'1':'0');}catch(e){}
    if(remindEl.checked){
      ensureAudio(); beep(); keepAwake();
      setStatus('Rappel activé : gardez cette page ouverte et l’écran allumé.');
    }else if(wakeLock){
      try{wakeLock.release();}catch(e){}
    }
  });
  $('alertok').addEventListener('click',function(){$('alert').hidden=true;});
  ['pointerdown','keydown'].forEach(function(ev){
    document.addEventListener(ev,function(){ if(remindEl.checked) ensureAudio(); },{passive:true});
  });
  document.addEventListener('visibilitychange',function(){ if(!document.hidden){ keepAwake(); tick(); } });
  try{ if(localStorage.getItem('planning:remind')==='1'){ remindEl.checked=true; keepAwake(); } }catch(e){}
  setInterval(tick,15000);

  /* ---------- vue semaine ---------- */
  function startOfWeek(d){
    var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
    x.setDate(x.getDate()-((x.getDay()+6)%7));
    return x;
  }
  function weekLabel(){
    var mon=startOfWeek(parseKey(dateKey)), sun=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+6);
    var a=mon.toLocaleDateString('fr-FR',mon.getMonth()===sun.getMonth()?{day:'numeric'}:{day:'numeric',month:'long'});
    var b=sun.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
    return 'Semaine du '+a+' au '+b;
  }
  function syncTabs(){
    $('tabday').setAttribute('aria-selected',view==='day'?'true':'false');
    $('tabweek').setAttribute('aria-selected',view==='week'?'true':'false');
  }
  function el(tag,cls,text){
    var e=document.createElement(tag);
    if(cls) e.className=cls;
    if(text!==undefined) e.textContent=text;
    return e;
  }
  async function renderWeek(){
    var token=++weekToken;
    var mon=startOfWeek(parseKey(dateKey));
    var keys=[];
    for(var i=0;i<7;i++) keys.push(keyOf(new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i)));
    var datas=await Promise.all(keys.map(function(k){return load(k);}));
    if(token!==weekToken||view!=='week') return;
    var box=$('week'), todayKey=keyOf(new Date());
    box.textContent='';
    keys.forEach(function(key,i){
      var rows=datas[i]||{};
      var hs=Object.keys(rows).map(function(k){return +k.slice(1);}).sort(function(a,b){return a-b;});
      var total=0, done=0;
      var list=el('ul','wlist');
      hs.forEach(function(h){
        var r=rows['h'+h]||{};
        var text=r.a||r.l||r.n||'';
        if(!text&&!r.d) return;
        total++; if(r.d) done++;
        var li=el('li',r.d?'is-done':'');
        if(r.p) li.dataset.p=r.p;
        li.appendChild(el('span','wh',pad(h)+'h'));
        li.appendChild(el('span','wt',text||'(sans titre)'));
        list.appendChild(li);
      });
      var d=parseKey(key);
      var card=el('section','wday'+(key===todayKey?' today':''));
      var head=el('button','wday-head');
      head.type='button';
      head.setAttribute('aria-label','Ouvrir le '+d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}));
      head.appendChild(el('span','wname',d.toLocaleDateString('fr-FR',{weekday:'short'}).replace('.','')));
      head.appendChild(el('span','wnum',String(d.getDate())));
      if(total) head.appendChild(el('span','wcount',done+'/'+total));
      head.addEventListener('click',function(){ dateKey=key; setView('day'); });
      card.appendChild(head);
      card.appendChild(total?list:el('p','wempty','Rien de prévu'));
      box.appendChild(card);
    });
  }
  async function setView(v){
    await settle();
    view=v;
    document.body.dataset.view=v;
    syncTabs(); showDate(); setStatus('');
    if(v==='week'){ await renderWeek(); }
    else { touched=false; setData(await load(dateKey)); }
  }
  $('tabday').addEventListener('click',function(){ if(view!=='day') setView('day'); });
  $('tabweek').addEventListener('click',function(){ if(view!=='week') setView('week'); });

  /* ---------- thème clair / sombre ---------- */
  var themeBtn=$('theme');
  var darkMQ=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
  function effectiveTheme(){
    var t=document.documentElement.getAttribute('data-theme');
    if(t==='light'||t==='dark') return t;
    return darkMQ&&darkMQ.matches?'dark':'light';
  }
  function themeLabel(){ themeBtn.textContent=effectiveTheme()==='dark'?'Thème clair':'Thème sombre'; }
  themeBtn.addEventListener('click',function(){
    var next=effectiveTheme()==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    try{localStorage.setItem('planning:theme',next);}catch(e){}
    themeLabel();
  });
  if(darkMQ&&darkMQ.addEventListener) darkMQ.addEventListener('change',themeLabel);
  themeLabel();

  /* ---------- start ---------- */
  showDate();
  setData(localGet(dateKey));
  (async function(){
    try{
      if(!window.claude||!window.claude.use) return;
      var results=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      var u=results[1];
      var id=u?await u.id():null;
      if(results[0]&&id){
        db=results[0]; uid=id;
        if(!touched&&view==='day'){ setData(await load(dateKey)); }
      }
    }catch(e){}
  })();
})();
</script>
</body>
</html>
